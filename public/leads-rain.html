<title>Adonyme — Leads</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  overflow: hidden;
}

.stage {
  position: relative;
  width: min(100vw, 100vh);
  aspect-ratio: 1/1;
  overflow: hidden;
}

.lead-card {
  position: absolute;
  background: #fff;
  border-radius: 20px;
  padding: 1.1% 1.4%;
  box-shadow: 0 6px 24px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.04);
  width: 43%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s cubic-bezier(0.34,1.56,0.64,1), transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}

/* 2×2 positions */
.lead-card:nth-child(1) { left: 3%;  top: 3%; }
.lead-card:nth-child(2) { left: 54%; top: 3%; }
.lead-card:nth-child(3) { left: 3%;  top: 52%; }
.lead-card:nth-child(4) { left: 54%; top: 52%; }

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid #f0f0f0;
}
.avatar {
  width: clamp(36px, 4.5vw, 48px);
  height: clamp(36px, 4.5vw, 48px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(12px, 1.6vw, 17px);
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}
.card-title { font-size: clamp(13px, 1.8vw, 20px); font-weight: 800; color: #0a0a0a; line-height: 1.2; }
.card-sector { font-size: clamp(10px, 1.3vw, 14px); color: #94a3b8; margin-top: 2px; }

.fields { display: flex; flex-direction: column; gap: 3px; }
.field-row { display: flex; align-items: center; justify-content: space-between; }
.field-label { font-size: clamp(10px, 1.3vw, 14px); font-weight: 600; color: #94a3b8; }
.field-value { font-size: clamp(11px, 1.4vw, 15px); font-weight: 700; color: #0a0a0a; }

.score-row { margin-top: 5px; padding-top: 5px; border-top: 1px solid #f0f0f0; }
.score-header { display: flex; justify-content: space-between; margin-bottom: 3px; }
.score-label { font-size: clamp(10px, 1.3vw, 14px); font-weight: 600; color: #94a3b8; }
.score-pct { font-size: clamp(13px, 1.7vw, 19px); font-weight: 900; color: #fb6931; }
.bar-bg { height: 5px; background: #f0f0f0; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: #fb6931; border-radius: 99px; width: 0; transition: width 1s ease; }

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 5px;
}
.channel-badge {
  font-size: clamp(9px, 1.2vw, 13px); font-weight: 700;
  padding: 3px 9px; border-radius: 6px;
  background: rgba(251,105,49,0.1); color: #fb6931;
}
.time-label { font-size: clamp(9px, 1.2vw, 13px); color: #94a3b8; }

.ping {
  position: absolute;
  top: 10px; right: 10px;
  width: 7px; height: 7px;
}
.ping-dot { width: 7px; height: 7px; border-radius: 50%; background: #fb6931; position: absolute; }
.ping-ring {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(251,105,49,0.4); position: absolute;
  animation: ping 1.4s ease-out infinite;
}
@keyframes ping {
  0%   { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(2.5); opacity: 0; }
}
</style>

<div class="stage" id="stage">
  <div class="lead-card" id="c0"></div>
  <div class="lead-card" id="c1"></div>
  <div class="lead-card" id="c2"></div>
  <div class="lead-card" id="c3"></div>
</div>

<script>
const CARDS = [
  { initials: 'BT', color: '#3b82f6', sector: 'BTP',
    projet: 'Extension', budget: '85 000 €', delai: '3 mois', region: 'Île-de-France',
    score: 87, channel: 'LinkedIn', time: 'Il y a 2j' },
  { initials: 'RC', color: '#f97316', sector: 'Recouvrement',
    projet: 'Créances B2B', budget: '12 000 €', delai: '1 mois', region: 'Occitanie',
    score: 94, channel: 'Email', time: 'Il y a 1j' },
  { initials: 'IM', color: '#8b5cf6', sector: 'Immobilier',
    projet: 'Programme neuf', budget: '40 000 €', delai: '6 mois', region: 'PACA',
    score: 76, channel: 'LinkedIn', time: 'Il y a 4j' },
  { initials: 'AS', color: '#10b981', sector: 'Assurance',
    projet: 'Courtage pro', budget: '25 000 €', delai: '2 mois', region: 'Auvergne-RA',
    score: 91, channel: 'WhatsApp', time: 'Il y a 3j' },
  { initials: 'EN', color: '#ef4444', sector: 'Énergie',
    projet: 'Solaire B2B', budget: '60 000 €', delai: '4 mois', region: 'Grand Est',
    score: 88, channel: 'Email', time: 'Il y a 6h' },
  { initials: 'RE', color: '#0ea5e9', sector: 'Recrutement',
    projet: 'CDI Senior', budget: '18 000 €', delai: '6 sem.', region: 'Lyon',
    score: 82, channel: 'LinkedIn', time: 'Il y a 12h' },
];

// Rotation per slot (slightly different for each)
const ROTATIONS = [-2.5, 2, 1.5, -2];

const els = [0,1,2,3].map(i => document.getElementById('c' + i));

function fillCard(el, data) {
  el.innerHTML = `
    <div class="ping"><div class="ping-ring"></div><div class="ping-dot"></div></div>
    <div class="card-head">
      <div class="avatar" style="background:${data.color}">${data.initials}</div>
      <div>
        <div class="card-title">Nouveau Lead</div>
        <div class="card-sector">${data.sector}</div>
      </div>
    </div>
    <div class="fields">
      <div class="field-row"><span class="field-label">Projet</span><span class="field-value">${data.projet}</span></div>
      <div class="field-row"><span class="field-label">Budget</span><span class="field-value">${data.budget}</span></div>
      <div class="field-row"><span class="field-label">Délai</span><span class="field-value">${data.delai}</span></div>
      <div class="field-row"><span class="field-label">Région</span><span class="field-value">${data.region}</span></div>
    </div>
    <div class="score-row">
      <div class="score-header">
        <span class="score-label">Score ICP</span>
        <span class="score-pct">0%</span>
      </div>
      <div class="bar-bg"><div class="bar-fill"></div></div>
    </div>
    <div class="card-foot">
      <span class="channel-badge">${data.channel}</span>
      <span class="time-label">${data.time}</span>
    </div>
  `;
}

const wait = ms => new Promise(r => setTimeout(r, ms));

function animateScore(el, target) {
  const bar = el.querySelector('.bar-fill');
  const pct = el.querySelector('.score-pct');
  bar.style.width = target + '%';
  const start = performance.now();
  (function step(now) {
    const t = Math.min((now - start) / 900, 1);
    const e = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    pct.textContent = Math.round(e * target) + '%';
    if (t < 1) requestAnimationFrame(step);
  })(performance.now());
}

async function showEl(el, data, slot) {
  const rot = ROTATIONS[slot];
  fillCard(el, data);
  // entry: come from below, slightly scaled down
  el.style.transition = 'none';
  el.style.opacity = '0';
  el.style.transform = `rotate(${rot}deg) translateY(14px) scale(0.94)`;
  await wait(20);
  el.style.transition = 'opacity 0.45s cubic-bezier(0.34,1.56,0.64,1), transform 0.45s cubic-bezier(0.34,1.56,0.64,1)';
  el.style.opacity = '1';
  el.style.transform = `rotate(${rot}deg) translateY(0) scale(1)`;
  await wait(500);
  animateScore(el, data.score);
}

async function hideEl(el, slot) {
  const rot = ROTATIONS[slot];
  el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
  el.style.opacity = '0';
  el.style.transform = `rotate(${rot}deg) translateY(-10px) scale(0.96)`;
  await wait(320);
}

let started = false;

async function run() {
  // Show all 4 with stagger
  for (let i = 0; i < 4; i++) {
    showEl(els[i], CARDS[i], i);
    await wait(350);
  }

  // Cycle: every 3s refresh one random card
  let used = [0, 1, 2, 3];

  while (started) {
    await wait(3000);
    const slot = Math.floor(Math.random() * 4);
    const available = CARDS.map((_, i) => i).filter(i => !used.includes(i));
    if (available.length === 0) { used = used.filter((_, i) => i !== slot); continue; }
    const next = available[Math.floor(Math.random() * available.length)];
    await hideEl(els[slot], slot);
    used[slot] = next;
    await showEl(els[slot], CARDS[next], slot);
  }
}

window.addEventListener('load', () => {
  if (!started) { started = true; run(); }
});
</script>
