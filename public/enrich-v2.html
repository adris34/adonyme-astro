<title>Adonyme CRM — Enrichissement contact</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #ECEEF7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  overflow: hidden;
}

.stage {
  position: relative;
  width: min(100vw, 133.33vh);
  aspect-ratio: 4/3;
  overflow: hidden;
  background: #ECEEF7;
}
.stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(79,70,229,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,70,229,.04) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* ── Slider track ── */
.slider-wrap {
  position: absolute;
  top: 50%; left: 0; right: 0;
  transform: translateY(-50%);
  z-index: 2;
  padding: 32px 0;
}
.cards-row {
  display: flex;
  gap: 20px;
  padding: 16px 60px;
  will-change: transform;
}

/* ── Base card ── */
.card {
  flex-shrink: 0;
  width: 220px;
  background: #fff;
  border-radius: 12px;
  padding: 14px 15px 12px;
  box-shadow: 0 2px 10px rgba(30,27,75,.08), 0 0 0 1px rgba(30,27,75,.06);
  transition: box-shadow .3s ease, transform .3s ease;
  cursor: default;
  position: relative;
}
.card.stale  { background: #FBF9F5; box-shadow: 0 2px 8px rgba(30,27,75,.06), 0 0 0 1px rgba(245,158,11,.2); }
.card.ghost  { opacity: .55; }
.card.active-card {
  box-shadow: 0 0 0 3px #4F46E5, 0 8px 32px rgba(79,70,229,.22);
  transform: translateY(-4px) scale(1.02);
  z-index: 10;
}

.stale-banner {
  display: flex; align-items: center; gap: 5px;
  background: #FEF3C7; border: 1px solid #FDE68A; border-radius: 5px;
  padding: 3px 7px; margin-bottom: 9px;
  font-size: 9.5px; font-weight: 700; letter-spacing: .4px;
  text-transform: uppercase; color: #92400E;
}
.stale-dot { width: 5px; height: 5px; border-radius: 50%; background: #F59E0B; flex-shrink: 0; }

.card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.name-block { flex: 1; min-width: 0; }
.c-name { font-size: 13px; font-weight: 700; color: #1E1B4B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-co   { font-size: 11px; color: #6B7280; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.fields { display: flex; flex-direction: column; gap: 4px; }
.fr { display: flex; align-items: baseline; gap: 5px; }
.fl { font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #9CA3AF; width: 48px; flex-shrink: 0; }
.fv { font-size: 11px; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.fv.link  { color: #4F46E5; }
.fv.email { color: #059669; }
.fv.empty { background: #E9EBF0; border-radius: 3px; height: 10px; width: 70px; display: inline-block; }

.card-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 9px; padding-top: 7px; border-top: 1px solid #F0F1F5;
}
.badge { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
.ch-li   { background: rgba(99,102,241,.12); color: #4338CA; }
.ch-em   { background: rgba(5,150,105,.12);  color: #047857; }
.ch-wa   { background: rgba(22,163,74,.12);  color: #15803D; }
.ch-none { background: #F3F4F6; color: #9CA3AF; }
.last-c  { font-size: 9.5px; color: #9CA3AF; }
.last-c.warn { color: #D97706; font-weight: 600; }

/* ── Alert badge "A changé de poste" ── */
.alert-badge {
  position: absolute;
  top: -14px; left: 50%; transform: translateX(-50%) scale(0);
  background: #FEF3C7; border: 1.5px solid #FDE68A;
  border-radius: 20px; padding: 4px 12px;
  font-size: 11px; font-weight: 700; color: #92400E;
  white-space: nowrap;
  transition: transform .35s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 20;
  display: flex; align-items: center; gap: 5px;
}
.alert-badge.show { transform: translateX(-50%) scale(1); }

/* ── Enrichir button (on card) ── */
.enrich-btn {
  display: flex; align-items: center; gap: 6px;
  margin-top: 10px;
  background: #4F46E5; color: #fff;
  border-radius: 8px; padding: 7px 14px;
  font-size: 12px; font-weight: 700;
  opacity: 0; transform: translateY(6px);
  transition: opacity .3s, transform .3s, box-shadow .2s;
  cursor: pointer;
}
.enrich-btn.show { opacity: 1; transform: translateY(0); }
.enrich-btn.pulse { box-shadow: 0 0 0 6px rgba(79,70,229,.28); }

/* ── Enriched data panel (replaces fields) ── */
.enriched-fields { display: none; flex-direction: column; gap: 4px; }
.enriched-fields.show { display: flex; }
.new-tag {
  font-size: 9px; font-weight: 800; color: #059669;
  background: rgba(5,150,105,.1); border-radius: 3px;
  padding: 1px 4px; margin-left: 4px; letter-spacing: .3px;
}

/* ── Scoring bar ── */
.scoring-wrap {
  margin-top: 10px;
  opacity: 0; transform: translateY(4px);
  transition: opacity .3s, transform .3s;
}
.scoring-wrap.show { opacity: 1; transform: translateY(0); }
.scoring-label {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 5px;
}
.scoring-title { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #6B7280; }
.scoring-pct   { font-size: 14px; font-weight: 900; color: #059669; font-variant-numeric: tabular-nums; }
.bar-bg { height: 7px; background: #E9EBF0; border-radius: 99px; overflow: hidden; }
.bar-fill {
  height: 100%; width: 0; border-radius: 99px;
  background: linear-gradient(90deg, #10B981, #059669);
  transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
}

/* ── Checkmark overlay ── */
.check-overlay {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(236,253,245,.88);
  border-radius: 12px;
  opacity: 0; pointer-events: none;
  transition: opacity .4s ease;
  z-index: 30;
}
.check-overlay.show { opacity: 1; }
.check-circle {
  width: 64px; height: 64px; border-radius: 50%;
  background: #059669;
  display: flex; align-items: center; justify-content: center;
  transform: scale(0);
  transition: transform .45s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 4px 20px rgba(5,150,105,.4);
}
.check-circle.show { transform: scale(1); }
.check-svg { width: 32px; height: 32px; }
.check-path {
  stroke: white; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 40;
  stroke-dashoffset: 40;
  transition: stroke-dashoffset .5s ease .2s;
}
.check-circle.show .check-path { stroke-dashoffset: 0; }

/* ── Cursor ── */
#cursor {
  position: absolute; width: 28px; height: 28px;
  pointer-events: none; z-index: 999; opacity: 0;
  transition: left .5s cubic-bezier(0.4,0,0.2,1), top .5s cubic-bezier(0.4,0,0.2,1);
}
#cursor.instant { transition: none; }
#cursor-ripple {
  position: absolute; width: 44px; height: 44px; border-radius: 50%;
  background: rgba(79,70,229,.15); border: 2px solid rgba(79,70,229,.4);
  pointer-events: none; z-index: 998;
  opacity: 0; transform: translate(-50%,-50%) scale(0);
  transition: transform .25s ease, opacity .25s ease;
}
#cursor-ripple.active { opacity: 1; transform: translate(-50%,-50%) scale(1); }
#cursor-ripple.expand { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }

/* ── Database panel ── */
.db-panel {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 52%;
  background: #fff;
  border-left: 1px solid #E5E7EB;
  box-shadow: -8px 0 40px rgba(30,27,75,.12);
  z-index: 50;
  transform: translateX(110%);
  transition: transform .55s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
}
.db-panel.show { transform: translateX(0); }

.db-header {
  padding: 20px 22px 16px;
  border-bottom: 1px solid #F3F4F6;
  background: #FAFBFF;
}
.db-title { font-size: 15px; font-weight: 800; color: #1E1B4B; display: flex; align-items: center; gap: 8px; }
.db-pill {
  background: #DCFCE7; color: #15803D;
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  letter-spacing: .3px;
}
.db-sub { font-size: 11px; color: #9CA3AF; margin-top: 3px; }

.db-list { flex: 1; overflow: hidden; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }

.db-row {
  display: flex; align-items: center; gap: 10px;
  background: #F9FAFB; border-radius: 8px; padding: 9px 11px;
  border: 1px solid #F0F1F5;
  opacity: 0; transform: translateX(20px);
  transition: opacity .3s ease, transform .3s ease;
}
.db-row.visible { opacity: 1; transform: translateX(0); }
.db-row.new-entry {
  background: #F0FDF4; border: 1px solid #BBF7D0;
  box-shadow: 0 0 0 2px rgba(5,150,105,.15);
}
.db-av {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #fff;
}
.db-info { flex: 1; min-width: 0; }
.db-name { font-size: 12px; font-weight: 700; color: #1E1B4B; }
.db-co   { font-size: 10px; color: #9CA3AF; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db-badge {
  font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 5px; flex-shrink: 0;
}
.db-ready { background: #DCFCE7; color: #15803D; }
.db-score { font-size: 11px; font-weight: 800; color: #059669; flex-shrink: 0; }

.db-footer {
  padding: 12px 18px;
  border-top: 1px solid #F3F4F6;
  background: #FAFBFF;
}
.db-cta {
  width: 100%; background: #4F46E5; color: white;
  border-radius: 8px; padding: 10px 0;
  font-size: 13px; font-weight: 700; text-align: center;
  opacity: 0; transform: translateY(6px);
  transition: opacity .3s .2s ease, transform .3s .2s ease;
}
.db-cta.show { opacity: 1; transform: translateY(0); }

/* Flying card particle */
.flying-card {
  position: absolute;
  width: 220px;
  background: #fff;
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 8px 32px rgba(79,70,229,.25);
  pointer-events: none;
  z-index: 100;
  transition: none;
}

/* ── Replay ── */
#replay {
  position: absolute; bottom: 16px; right: 16px; z-index: 200;
  background: rgba(79,70,229,.9); color: white; border: none;
  border-radius: 8px; padding: 8px 18px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  opacity: 0; transition: opacity .3s; font-family: inherit;
}
</style>

<div class="stage" id="stage">
  <div class="slider-wrap" id="sliderWrap">
    <div class="cards-row" id="cardsRow"></div>
  </div>
  <div id="cursor"><svg viewBox="0 0 28 28" fill="none"><path d="M4 2L24 14L14 16.5L10.5 26L4 2Z" fill="white" stroke="#1a1a2e" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
  <div id="cursor-ripple"></div>

  <button id="replay">↺ Rejouer</button>
</div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage');
const cardsRow = $('cardsRow');

const cards = [
  { name:'Romain Faure',    co:'Altis Recouv.',    li:'rfaure',   email:'r.faure@altis.fr',          ch:'em',   last:'Il y a 6 mois', color:'#F97316', state:'stale'  },
  { name:'Sophie Laurent',  co:'ImmoPro',           li:'slaurent', email:'s.laurent@immopro.fr',      ch:'em',   last:'Il y a 5j',     color:'#0EA5E9', state:'fresh'  },
  { name:'Claire Dupont',   co:'HRSolutions',       li:'',         email:'',                          ch:'none', last:'Jamais',        color:'#6B7280', state:'ghost'  },
  { name:'Thomas Mercier',  co:'Fulgurance EMS',    li:'tmercier', email:'thomas@fulgurance-ems.fr',  ch:'li',   last:'Il y a 2j',     color:'#6366F1', state:'fresh', target: true },
  { name:'Amélie Leroy',    co:'Recouvrement Pro',  li:'',         email:'aleroy@recpro.fr',          ch:'li',   last:'Il y a 2 mois', color:'#F59E0B', state:'stale'  },
  { name:'Élodie Vidal',    co:'DataOps',           li:'evidalops',email:'e.vidal@dataops.io',        ch:'li',   last:'Il y a 1j',     color:'#7C3AED', state:'fresh'  },
  { name:'Benoît Moreau',   co:'LegalRecouv.',      li:'bmoreau',  email:'b.moreau@legalr.fr',        ch:'em',   last:'Il y a 7 mois', color:'#EF4444', state:'stale'  },
  { name:'Hugo Maurin',     co:'PropMan',           li:'hmaurin',  email:'h.maurin@propman.fr',       ch:'wa',   last:'Il y a 4j',     color:'#059669', state:'fresh'  },
  { name:'Antoine Girard',  co:'Sud Immo',          li:'agirard',  email:'',                          ch:'li',   last:'Il y a 5 mois', color:'#F59E0B', state:'stale'  },
];

function initials(n) { return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function buildCard(p) {
  const div = document.createElement('div');
  div.className = 'card' + (p.state==='stale'?' stale':'') + (p.state==='ghost'?' ghost':'') + (p.target?' target-card':'');

  let h = '';
  if (p.state==='stale') h += `<div class="stale-banner"><div class="stale-dot"></div>À relancer</div>`;

  const avStyle = p.state==='ghost' ? '' : `style="background:${p.color}"`;
  h += `<div class="card-head">
    <div class="avatar" ${avStyle}>${initials(p.name)}</div>
    <div class="name-block">
      <div class="c-name">${p.name}</div>
      <div class="c-co" id="${p.target?'card-co':''}">${p.co}</div>
    </div>
  </div>`;

  h += `<div class="fields" id="${p.target?'base-fields':''}">`;
  h += `<div class="fr"><span class="fl">Email</span><span class="fv email">${p.email||'<span class="fv empty"></span>'}</span></div>`;
  if (p.li) h += `<div class="fr"><span class="fl">LinkedIn</span><span class="fv link">/${p.li}</span></div>`;
  h += `</div>`;

  if (p.target) {
    h += `<div class="enriched-fields" id="enriched-fields">
      <div class="fr"><span class="fl">Poste</span><span class="fv">CEO <span class="new-tag">NOUVEAU</span></span></div>
      <div class="fr"><span class="fl">Email</span><span class="fv email">t.mercier@fulgems.com <span class="new-tag">MAJ</span></span></div>
      <div class="fr"><span class="fl">LinkedIn</span><span class="fv link">/thomas-mercier-ceo</span></div>
      <div class="fr"><span class="fl">Tél.</span><span class="fv">+33 6 12 34 56 78</span></div>
    </div>`;
    h += `<div class="scoring-wrap" id="scoring-wrap">
      <div class="scoring-label">
        <span class="scoring-title">Score contact</span>
        <span class="scoring-pct" id="scoring-pct">0%</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="bar-fill"></div></div>
    </div>`;
    h += `<div class="enrich-btn" id="enrich-btn">⚡ Enrichir le contact</div>`;
    h += `<div class="alert-badge" id="alert-badge">🔔 A changé de poste</div>`;
    h += `<div class="check-overlay" id="check-overlay">
      <div class="check-circle" id="check-circle">
        <svg class="check-svg" viewBox="0 0 32 32">
          <polyline class="check-path" id="check-path" points="6,16 13,23 26,9"/>
        </svg>
      </div>
    </div>`;
  }

  h += `<div class="card-foot">
    <span class="badge ch-${p.ch}">${{li:'LinkedIn',em:'Email',wa:'WhatsApp',none:'Aucun canal'}[p.ch]}</span>
    <span class="last-c ${p.state==='stale'?'warn':''}">${p.last}</span>
  </div>`;

  div.innerHTML = h;
  return div;
}

// Build cards × 3 for infinite illusion
[...cards,...cards,...cards].forEach(p => cardsRow.appendChild(buildCard(p)));

// ── Utilities ──
const wait = ms => new Promise(r => setTimeout(r, ms));

function scenePos(el) {
  const sr = stage.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  return { x: er.left - sr.left + er.width/2, y: er.top - sr.top + er.height/2 };
}

async function moveCursor(x, y, instant) {
  const cur = $('cursor'), rip = $('cursor-ripple');
  if (instant) cur.classList.add('instant'); else cur.classList.remove('instant');
  cur.style.left = x+'px'; cur.style.top = y+'px';
  rip.style.left = x+'px'; rip.style.top = y+'px';
  return wait(instant ? 0 : 520);
}
async function doClick() {
  const rip = $('cursor-ripple');
  rip.classList.remove('expand'); rip.classList.add('active');
  await wait(110); rip.classList.add('expand'); rip.classList.remove('active');
  return wait(260);
}

function animateScore(targetPct, duration) {
  const pctEl = $('scoring-pct');
  const fill = $('bar-fill');
  const start = performance.now();
  function step(now) {
    const t = Math.min((now-start)/duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const val = Math.round(ease * targetPct);
    pctEl.textContent = val + '%';
    fill.style.width = (ease * targetPct) + '%';
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ── Main animation ──
async function run() {
  // Reset
  cardsRow.style.transition = 'none';
  cardsRow.style.transform = 'translateX(0)';
  $('cursor').style.opacity = '0';
  $('replay').style.opacity = '0';

  // Reset target card state
  const tc = document.querySelector('.target-card');
  if (tc) {
    tc.classList.remove('active-card');
    $('alert-badge')?.classList.remove('show');
    $('enrich-btn')?.classList.remove('show','pulse');
    $('enriched-fields')?.classList.remove('show');
    $('base-fields') && ($('base-fields').style.display = '');
    $('scoring-wrap')?.classList.remove('show');
    $('bar-fill') && ($('bar-fill').style.width = '0');
    $('scoring-pct') && ($('scoring-pct').textContent = '0%');
    $('check-overlay')?.classList.remove('show');
    $('check-circle')?.classList.remove('show');
  }

  await wait(300);

  // ── Phase 1: Fast scroll ──
  // Measure total width of one set of cards
  const cardW = 220 + 20; // card + gap
  const totalW = cards.length * cardW;
  // Scroll to just before the target card in the 2nd set
  const targetIdx = cards.findIndex(c => c.target); // index 3
  const targetX = totalW + targetIdx * cardW + 60; // 60 = padding

  // Fast scroll
  cardsRow.style.transition = 'transform 1.6s cubic-bezier(0.4,0,0.2,1)';
  cardsRow.style.transform = `translateX(-${targetX - stage.offsetWidth/2 + 110}px)`;
  await wait(1700);

  // Highlight target card
  const targetCard = document.querySelectorAll('.target-card')[1]; // 2nd set
  targetCard.classList.add('active-card');
  await wait(300);

  // Cursor appears and clicks card
  const tp = scenePos(targetCard);
  $('cursor').style.opacity = '1';
  moveCursor(tp.x + 60, tp.y + 80, true);
  await wait(50);
  await moveCursor(tp.x, tp.y - 10);
  await doClick();

  // ── Phase 2: Alert badge ──
  // Need to reference elements within that specific card
  const alertBadge = targetCard.querySelector('.alert-badge');
  const enrichBtn  = targetCard.querySelector('.enrich-btn');
  const baseFields = targetCard.querySelector('.fields');
  const enrichedFields = targetCard.querySelector('.enriched-fields');
  const scoringWrap = targetCard.querySelector('.scoring-wrap');
  const barFill = targetCard.querySelector('.bar-fill');
  const pctEl = targetCard.querySelector('.scoring-pct');
  const checkOverlay = targetCard.querySelector('.check-overlay');
  const checkCircle = targetCard.querySelector('.check-circle');

  alertBadge.classList.add('show');
  await wait(600);
  enrichBtn.classList.add('show');
  await wait(500);

  // Cursor moves to Enrichir button
  const ep = scenePos(enrichBtn);
  await moveCursor(ep.x, ep.y);
  enrichBtn.classList.add('pulse');
  await wait(150);
  await doClick();
  enrichBtn.classList.remove('pulse');

  // ── Phase 3: Loading → Enriched data ──
  enrichBtn.style.opacity = '0.4';
  enrichBtn.textContent = '⏳ Enrichissement…';
  await wait(800);

  // Swap fields
  baseFields.style.display = 'none';
  enrichedFields.classList.add('show');
  enrichBtn.style.display = 'none';
  await wait(300);

  // Scoring animates
  scoringWrap.classList.add('show');
  await wait(200);

  // Animate score
  const startTime = performance.now();
  const dur = 1300;
  const target = 93;
  function stepScore(now) {
    const t = Math.min((now-startTime)/dur, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const val = Math.round(ease * target);
    pctEl.textContent = val + '%';
    barFill.style.width = (ease * target) + '%';
    if (t < 1) requestAnimationFrame(stepScore);
  }
  requestAnimationFrame(stepScore);
  await wait(1400);

  $('cursor').style.opacity = '0';
  $('replay').style.opacity = '1';
}

$('replay').addEventListener('click', () => { $('replay').style.opacity='0'; run(); });

let started = false;
