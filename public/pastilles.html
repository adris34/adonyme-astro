<title>Pastilles Adonyme — Static</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f0f0f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
}

.stage {
  position: relative;
  width: min(100vw, 133.33vh);
  aspect-ratio: 4/3;
  background: #ffffff;
  overflow: hidden;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,.12);
}

svg.path-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.pill {
  position: absolute;
  background: #fb6931;
  color: #ffffff;
  border-radius: 999px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.4vw, 16px);
  padding: clamp(10px, 1.8vh, 20px) clamp(16px, 2.8vw, 32px);
  font-size: clamp(13px, 2.6vw, 28px);
  box-shadow: 0 4px 20px rgba(251,105,49,.35);
  width: 58%;
  z-index: 2;
}

.pill-num {
  background: rgba(255,255,255,0.22);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900;
  flex-shrink: 0;
  width: clamp(28px, 4.5vw, 52px);
  height: clamp(28px, 4.5vw, 52px);
  font-size: clamp(12px, 2vw, 24px);
  line-height: 1;
  aspect-ratio: 1;
}

.pill-dot {
  position: absolute;
  border-radius: 50%;
  background: #fb6931;
  border: 3px solid #fff;
  box-shadow: 0 0 0 2px #fb6931;
  z-index: 3;
}
</style>

<div class="stage" id="stage">
  <svg class="path-svg" id="svg"></svg>
</div>

<script>
const labels = [
  "Analyse de l'offre",
  "Client cible",
  "Stratégie créas",
  "Testing",
  "On valide les premiers leads",
  "Scale progressif",
];

const stage = document.getElementById('stage');
const svg   = document.getElementById('svg');

const TOP_PAD = 6, BOT_PAD = 6;
const ROWS = labels.length;
const rowH = (100 - TOP_PAD - BOT_PAD) / ROWS;
const LEFT_PILL_X = 4;
const RIGHT_PILL_X = 38;
const PILL_W = 58;
const PILL_FILL = 0.65;

function build() {
  stage.querySelectorAll('.pill, .pill-dot').forEach(e => e.remove());
  svg.innerHTML = '';

  const W = stage.offsetWidth;
  const H = stage.offsetHeight;
  const dotPositions = [];

  labels.forEach((text, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const centerY = TOP_PAD + rowH * i + rowH / 2;

    const pill = document.createElement('div');
    pill.className = 'pill';

    const numEl = document.createElement('div');
    numEl.className = 'pill-num';
    numEl.textContent = i + 1;

    const span = document.createElement('span');
    span.textContent = text;

    pill.appendChild(numEl);
    pill.appendChild(span);

    const pillLeft = side === 'left' ? LEFT_PILL_X : RIGHT_PILL_X;
    const rowPx  = H * rowH / 100;
    const pillH  = rowPx * PILL_FILL;
    const pillTop = H * (TOP_PAD + rowH * i) / 100 + (rowPx - pillH) / 2;

    pill.style.left   = pillLeft + '%';
    pill.style.top    = pillTop + 'px';
    pill.style.height = pillH + 'px';

    stage.appendChild(pill);

    // Dot
    const dotX = side === 'left' ? LEFT_PILL_X + PILL_W : RIGHT_PILL_X;
    const dotPxX = W * dotX / 100;
    const dotPxY = H * centerY / 100;
    const dotSize = Math.round(W * 0.016);

    const dot = document.createElement('div');
    dot.className = 'pill-dot';
    dot.style.left   = (dotPxX - dotSize / 2) + 'px';
    dot.style.top    = (dotPxY - dotSize / 2) + 'px';
    dot.style.width  = dotSize + 'px';
    dot.style.height = dotSize + 'px';
    stage.appendChild(dot);

    dotPositions.push({ x: dotPxX, y: dotPxY });
  });

  // SVG path
  if (dotPositions.length < 2) return;
  let d = '';
  const midX = W * 50 / 100;
  for (let i = 0; i < dotPositions.length - 1; i++) {
    const a = dotPositions[i];
    const b = dotPositions[i + 1];
    if (i === 0) d += `M ${a.x} ${a.y} `;
    const cp1x = a.x + (midX - a.x) * 0.6;
    const cp1y = a.y + (b.y - a.y) * 0.3;
    const cp2x = b.x + (midX - b.x) * 0.6;
    const cp2y = a.y + (b.y - a.y) * 0.7;
    d += `C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${b.x} ${b.y} `;
  }

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#fb6931');
  path.setAttribute('stroke-width', Math.round(W * 0.004));
  path.setAttribute('stroke-dasharray', `${W * 0.012} ${W * 0.008}`);
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('opacity', '0.6');
  svg.appendChild(path);
}

window.addEventListener('load', build);
window.addEventListener('resize', build);
</script>
